# Binary assets available on GitHub Releases, grouped by the version
# range in which each set of assets was first published.
#
# "from" is inclusive. Each entry applies to all releases from that
# version onward, until overridden by a later entry. Entries must be
# ordered oldest-first, and each entry is complete on its own: it does
# not inherit anything from the entry before it.
#
# "sbom" marks releases whose binaries have SPDX and CycloneDX SBOMs
# attached next to them on the GitHub release.

- from: "v1.7.1"
  assets:
    - { os: "Linux",   arch: "x86_64",    file: "ghostunnel-linux-amd64" }
    - { os: "Linux",   arch: "ARM64",     file: "ghostunnel-linux-arm64" }
    - { os: "macOS",   arch: "x86_64",    file: "ghostunnel-darwin-amd64" }
    - { os: "macOS",   arch: "ARM64",     file: "ghostunnel-darwin-arm64" }
    - { os: "macOS",   arch: "Universal", file: "ghostunnel-darwin-universal" }
    - { os: "Windows", arch: "x86_64",    file: "ghostunnel-windows-amd64.exe" }

- from: "v1.11.4"
  sbom: true
  assets:
    - { os: "Linux",   arch: "x86_64",    file: "ghostunnel-linux-amd64" }
    - { os: "Linux",   arch: "ARM64",     file: "ghostunnel-linux-arm64" }
    - { os: "macOS",   arch: "x86_64",    file: "ghostunnel-darwin-amd64" }
    - { os: "macOS",   arch: "ARM64",     file: "ghostunnel-darwin-arm64" }
    - { os: "macOS",   arch: "Universal", file: "ghostunnel-darwin-universal" }
    - { os: "Windows", arch: "x86_64",    file: "ghostunnel-windows-amd64.exe" }
