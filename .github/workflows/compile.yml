---
name: Compile

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docker:
    name: Build (Docker)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up buildx command
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          install: true
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Build containers
        run: go tool mage -v docker:build
        env:
          GITHUB_REF: ${{ github.ref }}
          # Exercise the SBOM attestation path on every pull request. The
          # release workflow gets it for free by pushing; here it has to be
          # asked for, and it needs the docker-container driver set up above.
          DOCKER_SBOM: "1"

  build-linux:
    name: Build (Linux)
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 100
          fetch-tags: true
      - name: Set up toolchain
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
        id: go
      - name: Build binary
        run: |
          go tool mage -compile ./mage-bin
          CGO_ENABLED=1 GOARCH=amd64 ./mage-bin -v go:build
          mv ghostunnel ghostunnel-linux-amd64
          CGO_ENABLED=1 GOARCH=arm64 CC=aarch64-linux-gnu-gcc ./mage-bin -v go:build
          mv ghostunnel ghostunnel-linux-arm64
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0.24.2
        with:
          syft-version: v1.52.0
      # A smoke test for the sbom:generate target, so a broken syft invocation
      # surfaces on a pull request instead of during a release. The documents
      # are deliberately not uploaded; the release workflow generates the ones
      # that ship.
      - name: Verify SBOM generation
        run: |
          ./mage-bin -v sbom:generate ghostunnel-linux-amd64
          ./mage-bin -v sbom:generate ghostunnel-linux-arm64
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ghostunnel-linux-amd64-${{ matrix.os }}
          path: ghostunnel-linux-amd64
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ghostunnel-linux-arm64-${{ matrix.os }}
          path: ghostunnel-linux-arm64

  build-darwin:
    name: Build (MacOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 100
          fetch-tags: true
      - name: Set up toolchain
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
        id: go
      - name: Build binary
        run: |
          go tool mage -compile ./mage-bin
          CGO_ENABLED=1 GOARCH=amd64 ./mage-bin -v go:build
          mv ghostunnel ghostunnel-darwin-amd64
          CGO_ENABLED=1 GOARCH=arm64 ./mage-bin -v go:build
          mv ghostunnel ghostunnel-darwin-arm64
          lipo -create -output ghostunnel-darwin-universal ghostunnel-darwin-amd64 ghostunnel-darwin-arm64
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ghostunnel-darwin-amd64
          path: ghostunnel-darwin-amd64
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ghostunnel-darwin-arm64
          path: ghostunnel-darwin-arm64
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ghostunnel-darwin-universal
          path: ghostunnel-darwin-universal

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 100
          fetch-tags: true
      - name: Set up toolchain
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
        id: go
      - name: Build binary
        run: go tool mage -v go:build
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ghostunnel-windows-amd64
          path: ghostunnel
